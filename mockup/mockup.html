<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Debut Loop! — 목업 (88비트)</title>
<style>
  :root{
    --bg:#f8f5fd; --panel:#ffffff; --line:#ece4f4; --ink:#5b4a70; --sub:#a99bc0;
    --pink:#ff7fb0; --lav:#a78be6; --amber:#f0a93a;
    --g-skill:#6fb8ff; --g-mental:#b39cff; --g-rep:#ff9ec4; --g-bond:#6fd8c4; --g-cap:#f0c05a;
    --img-bg:url("assets/bg_practice.png"); --img-char:url("assets/char1_bust.png");
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; color:var(--ink);
    background:
      linear-gradient(rgba(247,243,252,.15), rgba(247,243,252,.15)),
      var(--img-bg) center/cover no-repeat fixed,
      var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    display:flex; justify-content:center; overflow:hidden; }
  #wrap{ width:100%; max-width:430px; min-height:100vh; padding:16px 18px 60px; display:flex; flex-direction:column; }
  .badge{ font-size:11px; letter-spacing:.03em; color:var(--sub); text-align:center; margin-bottom:12px; }
  .badge b{ color:var(--pink); }
  /* 스탯 패널 (프메식 창) */
  .statpanel{ background:var(--panel); border:2px solid var(--line); border-radius:20px;
    padding:12px 14px; margin-bottom:14px; box-shadow:0 6px 22px rgba(167,139,230,.18); }
  .stathead{ display:flex; justify-content:space-between; align-items:center;
    font-size:13px; color:var(--sub); margin-bottom:11px; font-variant-numeric:tabular-nums; }
  .stathead .who{ font-weight:800; color:var(--pink); font-size:15px; letter-spacing:.02em; }
  .stathead .wk{ font-weight:700; color:var(--ink); }
  .gauges{ display:grid; gap:7px; }
  .practicebtn{ margin-top:11px; width:100%; padding:11px; border:1.5px solid var(--line);
    border-radius:14px; background:linear-gradient(180deg,#fff2f9,#ffe4f0); color:#c9527f;
    font-size:13.5px; font-weight:800; cursor:pointer; font-family:inherit; box-shadow:0 3px 10px rgba(255,127,176,.22); }
  .practicebtn:active{ transform:scale(.98); }
  .g{ display:grid; grid-template-columns:42px 1fr 26px 34px; align-items:center; gap:8px; font-size:12px; }
  .g .lbl{ color:var(--sub); letter-spacing:.05em; font-weight:700; }
  .bar{ height:10px; background:#f1eaf6; border-radius:6px; overflow:hidden; }
  .fill{ height:100%; border-radius:6px; transition:width .35s ease; }
  .g .num{ text-align:right; font-variant-numeric:tabular-nums; color:var(--ink); font-weight:700; }
  .g .delta{ text-align:right; font-size:11.5px; font-weight:800; font-variant-numeric:tabular-nums; opacity:0; transition:opacity .12s; }
  .g .delta.up{ color:#3fb98a; } .g .delta.down{ color:#ff6f91; }
  .g.bump{ animation:gbump .7s ease; border-radius:8px; }
  @keyframes gbump{ 0%{ background:rgba(255,127,176,.28); } 100%{ background:transparent; } }
  .g.bump .num{ animation:numpop .7s ease; }
  @keyframes numpop{ 0%,100%{ transform:scale(1); } 28%{ transform:scale(1.7); } }
  .g.bump .fill{ animation:fillpulse .7s ease; box-shadow:0 0 10px rgba(255,127,176,.6); }
  @keyframes fillpulse{ 0%,100%{ filter:none; } 28%{ filter:brightness(1.15) saturate(1.4); } }
  .g .delta.pop{ animation:deltapop .85s ease forwards; }
  @keyframes deltapop{ 0%{ transform:scale(2); opacity:1; } 60%{ opacity:1; } 100%{ transform:scale(1) translateY(-8px); opacity:0; } }
  .g.danger .lbl{ color:var(--amber); }
  .stage{ flex:1; display:flex; align-items:center; justify-content:center; }
  .deck{ position:relative; width:100%; }
  /* 카드 (프메식 창: 일러 + 대사창) */
  .card{ position:relative; width:100%; background:var(--panel);
    border:2px solid var(--line); border-radius:24px; padding:16px; min-height:200px;
    box-shadow:0 14px 40px rgba(167,139,230,.28); cursor:grab; user-select:none; touch-action:pan-y;
    will-change:transform; overflow:hidden; display:flex; flex-direction:column; }
  .card.grab{ cursor:grabbing; }
  .card.settle{ transition:transform .4s cubic-bezier(.2,.9,.25,1.2); }
  .card.fly{ transition:transform .32s ease-in, opacity .32s ease-in; }
  .portrait{ height:230px; margin:-16px -16px 0; border-radius:22px 22px 0 0;
    background:var(--img-char) center 12%/cover no-repeat;
    -webkit-mask-image:linear-gradient(180deg,#000 78%,transparent);
    mask-image:linear-gradient(180deg,#000 78%,transparent); }
  .glow{ position:absolute; inset:0; opacity:0; pointer-events:none; transition:opacity .1s; border-radius:24px; }
  .glow.l{ background:radial-gradient(120% 100% at 0% 50%, rgba(167,139,230,.4), transparent 55%); }
  .glow.r{ background:radial-gradient(120% 100% at 100% 50%, rgba(255,127,176,.4), transparent 55%); }
  .dialog{ background:#f8f4fc; border:1.5px solid var(--line); border-radius:18px;
    padding:12px 15px 15px; margin-top:-14px; position:relative; flex:1; z-index:1; }
  .scene{ display:inline-block; background:var(--pink); color:#fff; font-size:11px; font-weight:700;
    padding:4px 13px; border-radius:20px; margin-bottom:10px; letter-spacing:.03em;
    box-shadow:0 3px 8px rgba(255,127,176,.4); }
  .scene .conv{ color:#fff; opacity:.92; }
  .line{ font-size:17px; line-height:1.62; position:relative; color:var(--ink); }
  .hint{ margin-top:12px; font-size:12.5px; color:var(--lav); font-style:italic; position:relative; font-weight:600; }
  .choices{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .choices button{ padding:14px 8px; border:1.5px solid var(--line); border-radius:16px;
    font-size:13.5px; font-weight:800; cursor:pointer; font-family:inherit;
    transition:transform .1s, filter .12s, box-shadow .12s; }
  .choices button:active{ transform:scale(.97); }
  .choices button:focus-visible{ outline:2px solid var(--pink); outline-offset:2px; }
  .cl{ background:linear-gradient(180deg,#efe7fb,#e2d6f6); color:#6a53a8; }
  .cr{ background:linear-gradient(180deg,#ffe6f1,#ffd2e3); color:#c9527f; }
  .cl.armed{ box-shadow:0 0 0 2px var(--lav), 0 0 16px rgba(167,139,230,.55); transform:translateY(-2px); }
  .cr.armed{ box-shadow:0 0 0 2px var(--pink), 0 0 16px rgba(255,127,176,.55); transform:translateY(-2px); }
  .swipehint{ text-align:center; font-size:11px; color:var(--sub); margin-top:10px; letter-spacing:.04em; }
  .clues{ margin-top:10px; font-size:12px; color:#3aa88f; min-height:18px; display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
  .chip{ background:rgba(111,216,196,.18); border:1px solid rgba(111,216,196,.45); color:#2e9a80; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600; }
  .end{ text-align:center; padding:26px 8px; }
  .end .em{ font-size:40px; } .end h2{ font-size:22px; margin:12px 0 6px; color:var(--ink); }
  .end p{ color:var(--sub); line-height:1.6; font-size:14px; }
  .restart{ margin-top:20px; padding:14px 26px; border:0; border-radius:16px; cursor:pointer;
    font-size:14px; font-weight:800; color:#fff; background:linear-gradient(180deg,var(--pink),#ff5c9a); font-family:inherit; box-shadow:0 8px 20px rgba(255,127,176,.45); }
  @media (prefers-reduced-motion: reduce){ .card,.fill,.choices button{ transition:none; } }
  /* ── 막 통과 미니게임 관문 (3엔진) ── */
  .mg{ position:fixed; inset:0; z-index:50; padding:26px 22px;
    background:rgba(247,240,252,.95); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center;
    animation:mgin .25s ease; }
  @keyframes mgin{ from{ opacity:0; transform:scale(.96); } to{ opacity:1; transform:none; } }
  .mg h3{ margin:0; font-size:21px; letter-spacing:.02em; color:var(--ink); }
  .mg .desc{ font-size:12.5px; color:var(--sub); margin-top:-8px; }
  .mg .mgMsg{ font-size:14px; color:var(--pink); min-height:20px; font-weight:800; }
  /* 연습 메뉴 (프메식 활동 선택) */
  .tmenu{ display:grid; grid-template-columns:1fr 1fr; gap:10px; width:300px; max-width:84vw; }
  .tmenu button{ display:flex; flex-direction:column; align-items:center; gap:3px; padding:12px 8px;
    border:2px solid var(--line); border-radius:16px; background:var(--panel); color:var(--ink);
    cursor:pointer; font-family:inherit; box-shadow:0 4px 12px rgba(167,139,230,.15); }
  .tmenu button:active{ transform:scale(.96); }
  .tmenu .ti{ font-size:26px; }
  .tmenu .tn{ font-size:13px; font-weight:800; }
  .tmenu .te{ font-size:10.5px; color:var(--sub); font-weight:600; letter-spacing:.01em; }
  .mgBack{ margin-top:4px; background:none; border:0; color:var(--sub); font-size:13px;
    cursor:pointer; font-family:inherit; text-decoration:underline; text-underline-offset:2px; }
  .mgBack:active{ transform:scale(.97); }
  /* 연습 씬 (프메식: 연습실 배경 + 캐릭터 일러 위에 미니게임) */
  .mg.trainscene{ justify-content:flex-end; padding-bottom:38px;
    background:linear-gradient(180deg, rgba(24,14,34,.32), rgba(24,14,34,.74)),
      var(--img-bg) center/cover no-repeat; }
  .mg.trainscene::before{ content:""; position:absolute; left:50%; top:5%; transform:translateX(-50%);
    width:240px; height:320px; pointer-events:none;
    background:var(--img-char) center top/contain no-repeat;
    -webkit-mask-image:linear-gradient(180deg,#000 80%,transparent); mask-image:linear-gradient(180deg,#000 80%,transparent);
    filter:drop-shadow(0 8px 22px rgba(0,0,0,.45)); }
  .mg.trainscene>*{ position:relative; z-index:1; }
  .mg.trainscene h3{ color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.75); }
  .mg.trainscene .desc{ color:rgba(255,255,255,.88); text-shadow:0 1px 5px rgba(0,0,0,.75); }
  .mg.trainscene .mgMsg{ color:#ffe08a; text-shadow:0 1px 5px rgba(0,0,0,.75); }
  .mg.trainscene .reward{ color:#fff; text-shadow:0 1px 5px rgba(0,0,0,.6); }
  .mg.trainscene .reward.gz{ color:#8ff0d8; }
  .mgBtn{ margin-top:6px; padding:13px 30px; border:0; border-radius:16px; cursor:pointer;
    font-size:15px; font-weight:800; color:#fff; font-family:inherit;
    background:linear-gradient(180deg,var(--pink),#ff5c9a); box-shadow:0 8px 22px rgba(255,127,176,.45); }
  .mgBtn:active{ transform:scale(.97); }
  .rps{ display:flex; gap:14px; }
  .rps button{ width:88px; height:100px; border-radius:20px; border:2px solid var(--line);
    background:var(--panel); color:var(--ink); cursor:pointer;
    font-size:40px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-family:inherit; box-shadow:0 4px 14px rgba(167,139,230,.2); }
  .rps button small{ font-size:12px; color:var(--sub); font-weight:700; }
  .rps button:active{ transform:scale(.94); }
  .track{ position:relative; width:280px; max-width:80vw; height:26px; border-radius:13px;
    background:#f1eaf6; border:2px solid var(--line); overflow:hidden; }
  .track .zone{ position:absolute; top:0; bottom:0; transform:translateX(-50%); }
  .track .zone.good{ left:50%; width:36%; background:rgba(111,216,196,.3); }
  .track .zone.perfect{ left:50%; width:12%; background:rgba(240,169,58,.55); }
  .track .marker{ position:absolute; top:-3px; bottom:-3px; width:4px; margin-left:-2px;
    background:var(--pink); box-shadow:0 0 10px var(--pink); border-radius:2px; }
  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; width:260px; max-width:78vw; }
  .mcard{ aspect-ratio:3/4; border-radius:16px; border:2px solid var(--line); cursor:pointer;
    background:linear-gradient(180deg,#efe7fb,#e2d6f6); color:var(--ink); font-size:34px; font-family:inherit;
    display:flex; align-items:center; justify-content:center; transition:transform .12s; }
  .mcard.up{ background:var(--panel); }
  .mcard.done{ background:linear-gradient(180deg,#d7f3ea,#c2ebde); opacity:.7; cursor:default; }
  .mcard:active{ transform:scale(.95); }
  .reward{ font-size:15px; font-weight:700; color:var(--ink); }
  .reward.gz{ color:#3aa88f; font-size:13.5px; font-variant-numeric:tabular-nums; }
  /* ── 미니게임 다이렉트 테스트 바 (개발 전용) ── */
  #testbar{ position:fixed; left:0; right:0; bottom:0; z-index:40; display:flex; gap:6px; flex-wrap:wrap;
    justify-content:center; align-items:center; padding:8px 10px;
    background:rgba(255,255,255,.9); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); border-top:2px solid var(--line); }
  #testbar span{ font-size:11px; color:var(--sub); font-weight:700; }
  #testbar button{ font-size:11.5px; padding:6px 10px; border-radius:10px; border:1.5px solid var(--line);
    background:#fdf3f8; color:var(--ink); cursor:pointer; font-family:inherit; font-weight:600; }
  #testbar button:active{ transform:scale(.95); }
</style>
</head>
<body>
<div id="wrap">
  <div class="badge">🧪 목업 · <b>데모② · 스와이프 + 미니게임 + 육성</b> · 카드를 좌우로 밀어보세요</div>
  <div class="statpanel">
    <div class="stathead">
      <span class="who">🎤 하루</span>
      <span class="wk" id="week">W0 · D-24</span>
      <span id="deck">🎴 0</span>
      <span id="points">⭐ 0</span>
    </div>
    <div class="gauges" id="gauges"></div>
    <button class="practicebtn" onclick="testTraining()">🎹 연습하기</button>
  </div>
  <div class="stage"><div class="deck" id="slot"></div></div>
  <div class="clues" id="clues"></div>
</div>
<div id="testbar">
  <span>🎮</span>
  <button onclick="testGate('rps')">🥇센터(1→2막)</button>
  <button onclick="testGate('stop')">🎯무대(2→3막)</button>
  <button onclick="testGate('photo')">📷포토(3→4막)</button>
  <button onclick="testGate('clue')">🔍단서(4→5막)</button>
  <button onclick="testGate('block')">🎤저지(5막)</button>
</div>

<script>
const DATA = JSON.parse(document.getElementById("beatsData").textContent);
const CAST = Object.assign({ protagonist:"하루", helper:"유월", mentor:"하리" }, DATA.casting||{});
const GAUGE_META=[["skill","실력","var(--g-skill)"],["mental","멘탈","var(--g-mental)"],
  ["reputation","평판","var(--g-rep)"],["bond","유대","var(--g-bond)"],["capital","자본","var(--g-cap)"]];
const ACTNAME=["프롤로그","1막 오디션","2막 지하","3막 성장","4막 진실","5막 데뷔"];
const $=id=>document.getElementById(id);
const sub=t=>t.replace(/\{(\w+)\}/g,(_,k)=>CAST[k]||k);

let state, busy=false, cursor=0, played, current, bumpKeys=[], gatesDone;
function fresh(){ played=new Set(); cursor=0; busy=false; gatesDone=new Set();
  return { week:0, act:0, points:0, dead:false, flags:new Set(), clues:new Set(), deck:{},
    gauges:{skill:30,mental:55,reputation:20,bond:40,capital:20} }; }

function meets(r){
  if(!r) return true;
  if(r.flags && !r.flags.every(f=>state.flags.has(f))) return false;
  if(r.notFlags && r.notFlags.some(f=>state.flags.has(f))) return false;
  if(r.castRoles && !r.castRoles.every(role=>role in CAST)) return false;
  return true; // ownTickets/gauge: 목업에선 생략
}
function nextBeat(){
  for(let i=cursor;i<DATA.beats.length;i++){
    const b=DATA.beats[i];
    if(played.has(b.id)) continue;
    if(!meets(b.requires)) continue;
    cursor=i+1; return b;
  }
  return null;
}
function applyEffects(e){
  if(!e) return;
  if(e.gauges) for(const[k,v]of Object.entries(e.gauges)) state.gauges[k]=(state.gauges[k]||0)+v;
  if(e.flags) e.flags.forEach(f=>state.flags.add(f));
  if(e.clearFlags) e.clearFlags.forEach(f=>state.flags.delete(f));
  if(e.addClue) state.clues.add(e.addClue);
  if(e.points) state.points+=e.points;
}
function showPreview(dir,t){
  if(!current) return;
  if(current[dir].train){ const tr=current[dir].train;
    for(const[k]of GAUGE_META){ const el=document.getElementById("dl_"+k); if(el){el.textContent="";el.style.opacity=0;} }
    const up=Object.entries(tr.gauges||{}).map(([k,v])=>`${GL(k)}+${v}`).join(" ");
    const dn=Object.entries(tr.drain||{}).map(([k,v])=>`${GL(k)}−${v}`).join(" ");
    $("points").textContent=`🎮 ${tr.name}${up?" "+up:""}${dn?" / "+dn:""}`;
    return; }
  const eff=current[dir].effects||{}; const g=eff.gauges||{}; let any=false;
  for(const[k] of GAUGE_META){
    const el=document.getElementById("dl_"+k); if(!el) continue;
    const v=g[k];
    if(v){ el.textContent=(v>0?"+":"")+v; el.className="delta "+(v>0?"up":"down"); el.style.opacity=0.4+0.6*t; any=true; }
    else { el.textContent=""; el.style.opacity=0; }
  }
  const pts=eff.points||0, clue=eff.addClue, flg=(eff.flags&&eff.flags.length);
  let extra="";
  if(pts) extra+=` (+${pts}⭐)`;
  if(clue) extra+=" 🔍+1";
  if(!any && !pts && !clue) extra+=(flg?" · 전개 분기":" · 변화 없음");
  $("points").textContent=`⭐ ${state.points}${extra}`;
}
function clearPreview(){
  for(const[k] of GAUGE_META){ const el=document.getElementById("dl_"+k); if(el){ el.textContent=""; el.style.opacity=0; } }
  if(state) $("points").textContent=`⭐ ${state.points}`;
}

function renderGauges(){
  $("gauges").innerHTML=GAUGE_META.map(([k,l,c])=>{const v=Math.max(0,Math.min(100,state.gauges[k]));
    const bump=bumpKeys.includes(k)?" bump":"";
    return `<div class="g ${v<=15?'danger':''}${bump}"><span class="lbl">${l}</span>
      <div class="bar"><div class="fill" style="width:${v}%;background:${c}"></div></div>
      <span class="num">${Math.round(v)}</span><span class="delta" id="dl_${k}"></span></div>`;}).join("");
  bumpKeys=[];
}
function renderTop(){ $("week").textContent=`W${state.week} · D-${24-state.week}`;
  $("points").textContent=`⭐ ${state.points}`;
  $("deck").textContent=`🎴 ${Object.values(state.deck).reduce((a,b)=>a+b,0)}`;
  const CLABEL={clue_schedule:"이상한 스케줄",clue_leak:"영상 유출",clue_astroturf:"악플 IP",clue_mastermind:"배후=대형사"};
  $("clues").innerHTML=`🔍 단서 ${state.clues.size}/4 `+[...state.clues].map(c=>`<span class="chip">${CLABEL[c]||c}</span>`).join("");
}
function renderCard(b){
  current=b; state.week=b.week; state.act=b.act;
  $("slot").innerHTML=`<div class="card" id="card">
    <div class="glow l"></div><div class="glow r"></div>
    <div class="portrait"></div>
    <div class="dialog">
      <div class="scene">${ACTNAME[b.act]||''} · W${b.week}${b.isConvergence?' <span class="conv">◆ 핵심</span>':''}</div>
      <div class="line">${sub(b.textKey)}</div>
      ${(b.left.hint||b.right.hint)?`<div class="hint">${b.left.hint||b.right.hint}</div>`:""}
    </div>
    <div class="choices">
      <button class="cl" id="bL">← ${b.left.label}</button>
      <button class="cr" id="bR">${b.right.label} →</button>
    </div>
    <div class="swipehint">밀거나 · 탭 · ← → 키</div>`;
  bindDrag();
}
function bindDrag(){
  const card=$("card"),gl=card.querySelector(".glow.l"),gr=card.querySelector(".glow.r"),bL=$("bL"),bR=$("bR");
  let dragging=false,sx=0,dx=0; const TH=100;
  const apply=x=>{ card.style.transform=`translateX(${x}px) rotate(${x*0.055}deg)`;
    const t=Math.min(1,Math.abs(x)/TH); gl.style.opacity=x<0?t:0; gr.style.opacity=x>0?t:0;
    bL.classList.toggle("armed",x<=-TH*0.6); bR.classList.toggle("armed",x>=TH*0.6);
    if(Math.abs(x)>16) showPreview(x<0?"left":"right", t); else clearPreview(); };
  card.onpointerdown=e=>{ if(busy)return; dragging=true; sx=e.clientX; card.classList.add("grab");
    card.classList.remove("settle"); card.setPointerCapture(e.pointerId); };
  card.onpointermove=e=>{ if(!dragging)return; dx=e.clientX-sx; apply(dx); };
  const doneDrag=()=>{ if(!dragging)return; dragging=false; card.classList.remove("grab");
    if(dx<=-TH)commit("left"); else if(dx>=TH)commit("right"); else settle(); dx=0; };
  card.onpointerup=doneDrag; card.onpointercancel=doneDrag;
  function settle(){ card.classList.add("settle"); card.style.transform="translateX(0) rotate(0)";
    gl.style.opacity=0; gr.style.opacity=0; bL.classList.remove("armed"); bR.classList.remove("armed"); clearPreview(); }
  bL.onclick=()=>!busy&&commit("left"); bR.onclick=()=>!busy&&commit("right");
}
function commit(dir){ if(busy||!current)return; busy=true;
  const card=$("card"),s=dir==="left"?-1:1;
  card.classList.remove("settle"); card.classList.add("fly");
  card.style.transform=`translateX(${s*140}%) rotate(${s*18}deg)`; card.style.opacity="0";
  const choice=current[dir];
  setTimeout(async ()=>{ played.add(current.id);
    if(choice.train){ await runGate(choice.train); step(); }
    else { bumpKeys=Object.keys((choice.effects&&choice.effects.gauges)||{}); applyEffects(choice.effects); busy=false; step(); }
  }, 300);
}
function end(em,t,d){ current=null;
  $("slot").innerHTML=`<div class="end"><div class="em">${em}</div><h2>${t}</h2><p>${d}</p>
    <button class="restart" onclick="start()">다시 회귀 ↺</button></div>`; }
/* ───── 막 통과 미니게임 (3엔진 리스킨) · SSOT: 통합안1 스펙 §5.5 ───── */
const GATES={  // 막 경계(act 진입) 관문
  2:{engine:"rps",  name:"센터 대결",    card:"오디션 진행권", gauges:{skill:4,reputation:4}},
  3:{engine:"stop", name:"무대 집중",    card:"지하 데뷔권",   gauges:{skill:4,mental:4}},
  4:{engine:"match",name:"포토카드 촬영",card:"포토카드권",    gauges:{reputation:4,bond:4}},
};
const BEAT_GATES={  // 특정 서사 지점(막 경계가 아닌) 관문
  d2_w22_clue4:{engine:"match",skin:"clue",name:"단서 대조",    card:"단서 조각",       gauges:{mental:4,bond:2}},
  d2_w24_block:{engine:"stop",             name:"사보타주 저지",card:"트루엔딩 게이트", gauges:{skill:3,mental:3,reputation:3}},
};
const GL=k=>(GAUGE_META.find(m=>m[0]===k)||[0,k])[1];
function runGate(gate){ return new Promise(res=>{
  busy=true;
  const ov=document.createElement("div"); ov.className=gate.training?"mg trainscene":"mg"; document.body.appendChild(ov);
  const engine=()=>{ if(gate.engine==="rest")rest(); else if(gate.engine==="rps")rps(); else if(gate.engine==="stop")stopBar(); else matchGame(); };
  function win(grade){
    const mult=grade==="perfect"?1.5:grade==="good"?1:0.6, applied={};
    for(const[k,v]of Object.entries(gate.gauges||{})){ const d=Math.max(1,Math.round(v*mult)); state.gauges[k]=(state.gauges[k]||0)+d; applied[k]=(applied[k]||0)+d; }
    if(gate.drain) for(const[k,v]of Object.entries(gate.drain)){ state.gauges[k]=(state.gauges[k]||0)-v; applied[k]=(applied[k]||0)-v; }
    const pts=grade==="perfect"?3:grade==="good"?2:1; state.points+=pts;
    let cardTxt;
    if(gate.training){ if(grade!=="clear"){ state.deck[gate.card]=(state.deck[gate.card]||0)+1; cardTxt=`🎴 ${gate.card} 카드 +1`; } else cardTxt="🎴 카드 없음 (등급 부족)"; }
    else cardTxt=`🎟 ${gate.card} 획득`;
    bumpKeys=Object.keys(applied); renderGauges(); renderTop();
    const gt=Object.entries(applied).map(([k,v])=>`${GL(k)} ${v>0?"+":""}${v}`).join(" · ");
    const GN={perfect:"PERFECT ✨",good:"GOOD 👍",clear:"CLEAR ✔"};
    ov.innerHTML=`<h3>${GN[grade]}</h3><div class="reward">${cardTxt}</div>
      <div class="reward gz">${gt}</div><div class="reward">+${pts}⭐</div><button class="mgBtn">계속 →</button>`;
    ov.querySelector(".mgBtn").onclick=()=>{ ov.remove(); busy=false; res(grade); };
  }
  function lose(){ state.gauges.mental=(state.gauges.mental||0)-1; renderGauges(); renderTop();
    ov.innerHTML=`<h3>아쉬워요…</h3><div class="desc">재도전할까요? (멘탈 −1)</div><button class="mgBtn">다시 →</button>`;
    ov.querySelector(".mgBtn").onclick=engine; }
  // A. 가위바위포즈
  function rps(){ let round=0,wins=0,last=null; const H=["✊","✋","✌️"],N=["바위","보","가위"];
    const beat=(a,b)=>(a===0&&b===2)||(a===1&&b===0)||(a===2&&b===1);
    const draw=msg=>{ ov.innerHTML=`<h3>🥇 ${gate.name}</h3>
      <div class="desc">가위바위포즈 · 3판 2선 · 상대 직전 손 ${last==null?"—":H[last]}</div>
      <div class="mgMsg">${msg||`${round+1}/3 라운드 · ${wins}승`}</div>
      <div class="rps">${H.map((h,i)=>`<button data-i="${i}">${h}<small>${N[i]}</small></button>`).join("")}</div>`;
      ov.querySelectorAll(".rps button").forEach(b=>b.onclick=()=>play(+b.dataset.i)); };
    const play=me=>{ const opp=Math.floor(Math.random()*3); let r;
      if(me===opp)r="비김"; else if(beat(me,opp)){wins++;r="이겼다!";} else r="졌다";
      last=opp; round++;
      if(round>=3){ wins>=2?win(wins===3?"perfect":"good"):lose(); }
      else draw(`${H[me]} vs ${H[opp]} — ${r} (${wins}승)`); };
    draw(); }
  // D. 타이밍 STOP
  function stopBar(){ ov.innerHTML=`<h3>🎯 ${gate.name}</h3>
    <div class="desc">타이밍 STOP · 가운데 존에서 멈춰요</div><div class="mgMsg">&nbsp;</div>
    <div class="track"><div class="zone good"></div><div class="zone perfect"></div><div class="marker" id="mk"></div></div>
    <button class="mgBtn" id="sb">STOP</button>`;
    const mk=ov.querySelector("#mk"); let pos=0,dir=1,raf;
    const loop=()=>{ pos+=dir*1.7; if(pos>=100){pos=100;dir=-1;} if(pos<=0){pos=0;dir=1;} mk.style.left=pos+"%"; raf=requestAnimationFrame(loop); };
    loop();
    ov.querySelector("#sb").onclick=()=>{ cancelAnimationFrame(raf); const d=Math.abs(pos-50);
      d<=6?win("perfect"):d<=18?win("good"):lose(); }; }
  // B. 짝맞추기 (포토카드 / 단서)
  function rest(){ ov.innerHTML=`<h3>🤝 ${gate.name}</h3><div class="desc">다 같이 쉬며 재충전한다…</div><div class="mgMsg">&nbsp;</div><button class="mgBtn">완료 →</button>`;
    ov.querySelector(".mgBtn").onclick=()=>win("good"); }
  function matchGame(){ const sets=gate.skin==="clue"?["📅","📹","💬"]:gate.skin==="promo"?["📸","📱","💗"]:["🌙","⭐","🎤"];
    const deck=sets.concat(sets);
    for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
    let open=[],matched=0,miss=0,lock=false;
    ov.innerHTML=`<h3>${gate.skin==="clue"?"🔍":"📷"} ${gate.name}</h3>
      <div class="desc">${gate.skin==="clue"?"단서":"포토카드"} 짝맞추기 · 적게 틀릴수록 고득점</div>
      <div class="mgMsg" id="mm">틀림 0</div>
      <div class="grid">${deck.map((s,i)=>`<button class="mcard" data-i="${i}">?</button>`).join("")}</div>`;
    ov.querySelectorAll(".mcard").forEach(b=>b.onclick=()=>{ if(lock)return;
      if(b.classList.contains("up")||b.classList.contains("done"))return;
      const i=+b.dataset.i; b.textContent=deck[i]; b.classList.add("up"); open.push(b);
      if(open.length===2){ lock=true; const[a,c]=open;
        if(deck[+a.dataset.i]===deck[+c.dataset.i]){ matched++;
          setTimeout(()=>{[a,c].forEach(x=>{x.classList.remove("up");x.classList.add("done");}); open=[]; lock=false;
            if(matched===sets.length) win(miss===0?"perfect":miss<=2?"good":"clear"); },320); }
        else { miss++; ov.querySelector("#mm").textContent="틀림 "+miss;
          setTimeout(()=>{[a,c].forEach(x=>{x.textContent="?";x.classList.remove("up");}); open=[]; lock=false; },620); } }
    }); }
  engine();
}); }

/* ───── 연습 메뉴 (프메식 활동 선택 · 별도 UI) ───── */
const TRAININGS=[
  {icon:"🎤",engine:"stop",            name:"보컬 연습",  card:"보컬",  training:true,gauges:{skill:6},           drain:{mental:3}},
  {icon:"💃",engine:"stop",            name:"안무 연습",  card:"안무",  training:true,gauges:{skill:6},           drain:{mental:3}},
  {icon:"📸",engine:"match",skin:"promo",name:"SNS 홍보", card:"홍보",  training:true,gauges:{reputation:6},      drain:{capital:3}},
  {icon:"💰",engine:"stop",            name:"알바",       card:"알바",  training:true,gauges:{capital:6},         drain:{mental:2}},
  {icon:"🎯",engine:"rps",             name:"오디션 대비",card:"오디션",training:true,gauges:{skill:5,reputation:3},drain:{mental:3}},
  {icon:"🤝",engine:"rest",            name:"휴식",    card:"휴식",  training:true,gauges:{mental:6,bond:4}},
];
function effLabel(t){ const u=Object.entries(t.gauges||{}).map(([k,v])=>`${GL(k)}+${v}`);
  const d=Object.entries(t.drain||{}).map(([k,v])=>`${GL(k)}−${v}`); return [...u,...d].join(" "); }
function renderTrainingMenu(b,onDone){ busy=true; current=null; state.week=b.week; state.act=b.act; renderTop();
  const ov=document.createElement("div"); ov.className="mg"; document.body.appendChild(ov);
  ov.innerHTML=`<h3>🎹 연습 시간 · W${b.week}</h3><div class="desc">${sub(b.textKey)}</div>
    <div class="tmenu">${TRAININGS.map((t,i)=>`<button data-i="${i}"><span class="ti">${t.icon}</span><span class="tn">${t.name}</span><span class="te">${effLabel(t)}</span></button>`).join("")}</div>
    <button class="mgBack" id="tback">← 뒤로 (연습 건너뛰기)</button>`;
  ov.querySelectorAll(".tmenu button").forEach(btn=>btn.onclick=async()=>{ ov.remove(); played.add(b.id); await runGate(TRAININGS[+btn.dataset.i]); if(onDone)onDone(); else step(); });
  ov.querySelector("#tback").onclick=()=>{ ov.remove(); busy=false; if(onDone)onDone(); else { played.add(b.id); step(); } };
}

async function step(){ renderTop(); renderGauges();
  if(Object.values(state.gauges).some(v=>v<=0))
    return end("💀","파멸 — 게이지 붕괴","게이지 하나가 바닥났다. (실제: 강등→패자부활전→탈락)");
  const b=nextBeat();
  if(!b){
    if(state.flags.has("ending_true")) return end("🎤","데뷔 성공 · 저지","단서 4개로 사보타주를 막았다! 5명이 끝까지 함께한 따뜻한 데뷔.");
    if(state.flags.has("ending_dark")) return end("🌑","데뷔 사고 · 다크",`단서 ${state.clues.size}/4 — 진실을 다 못 밝혔다. "눈을 뜨니 0시." (회귀)`);
    return end("🏁","런 종료",`도달 가능한 비트가 끝났습니다. 단서 ${state.clues.size}/4.`);
  }
  const gate = (GATES[b.act] && b.act>state.act && !gatesDone.has(b.act)) ? {key:b.act,def:GATES[b.act]}
             : (BEAT_GATES[b.id] && !gatesDone.has(b.id)) ? {key:b.id,def:BEAT_GATES[b.id]} : null;
  if(gate){
    gatesDone.add(gate.key);
    await runGate(gate.def);
    renderTop(); renderGauges();
    if(Object.values(state.gauges).some(v=>v<=0))
      return end("💀","파멸 — 멘탈 소진","관문 재도전으로 멘탈이 바닥났다. (실제: 3단 사다리)");
  }
  if(b.training){ renderTrainingMenu(b); return; }
  renderCard(b);
}
window.start=()=>{ state=fresh(); step(); };
const TESTDEF={rps:GATES[2],stop:GATES[3],photo:GATES[4],clue:BEAT_GATES.d2_w22_clue4,block:BEAT_GATES.d2_w24_block};
window.testGate=k=>{ if(busy||!state)return; runGate(TESTDEF[k]); };
window.testTraining=()=>{ if(busy||!state)return; const back=current;
  renderTrainingMenu({id:"test_train",week:state.week,act:state.act,training:true,textKey:"🎹 이번 주 연습 — 활동을 골라보세요."},
    ()=>{ if(back)renderCard(back); else step(); }); };
document.addEventListener("keydown",e=>{ if(busy||!current)return;
  if(e.key==="ArrowLeft")commit("left"); if(e.key==="ArrowRight")commit("right"); });
start();
</script>
